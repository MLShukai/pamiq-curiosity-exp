defaults:
  - environment: vrchat

_target_: pamiq_core.FixedIntervalInteraction.with_sleep_adjustor
interval: 0.1 # 10 fps.

agent:
  _target_: exp.agents.integration.IntegratedCuriosityFramework
  unimodal_encoding:
    _target_: exp.agents.no_collect.NoCollectAgent
  curiosity:
    _target_: exp.agents.curiosity.ttt.TTTCuriosityAgent
    surprisal_mean_ema_decay: 0.9999
    fatigue_decay: 0.999
    device: ${shared.device}
    dtype: ${shared.dtype}
