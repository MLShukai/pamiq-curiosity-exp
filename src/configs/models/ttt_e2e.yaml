disable_jepa: null
image_identity_patchifier:
  _target_: pamiq_core.torch.TorchTrainingModel
  has_inference_model: true
  device: ${shared.device}
  dtype: ${shared.dtype}
  inference_procedure:
    _target_: exp.models.components.image_patchifier.AddAndRemoveBatchDim
  model:
    _target_: exp.models.components.image_patchifier.ImageIdentityPatchifier
    patch_size: 12
fd_policy_value:
  _target_: pamiq_core.torch.TorchTrainingModel
  has_inference_model: true
  device: ${shared.device}
  dtype: ${shared.dtype}
  inference_procedure:
    _target_: hydra.utils.get_method
    path: exp.models.fd_policy.TTTFDPiV.forward_with_no_len
  model:
    _target_: exp.models.fd_policy.TTTFDPiV
    obs_info:
      _target_: exp.models.utils.ObsInfo
      dim: 432
      num_tokens:
        _target_: exp.models.components.image_patchifier.ImageIdentityPatchifier.compute_num_patches
        image_size:
          - ${shared.image.height}
          - ${shared.image.width}
        patch_size: 12 # Same as JEPA Instantiation
      dim_hidden: 1 # Dummy
    obs_dim_hidden: 1024
    action_info:
      _target_: exp.models.utils.ActionInfo
      choices:
        _target_: hydra.utils.get_object
        path: exp.envs.vrchat.OSC_ACTION_CHOICES
      dim: 8
    internal_action_dim: 64
    internal_state_dim: 1
    dim: ${.core_model.dim}
    obs_encoder:
      _target_: exp.models.components.vit_encoder.TransformerEncoder
      dim_in: 432
      dim: ${..obs_dim_hidden}
      dim_hidden: 4096
      num_enc_layers: 0
      num_dec_layers: 4
      num_heads: 8
      num_tokens_enc: ${..obs_info.num_tokens}
      num_tokens_dec: 8
    time_mixer:
      _target_: exp.models.components.qgru.QGRU
      dim: 1024
      dim_ff_hidden: ${python.eval:"${.dim} * 4"}
      depth: 2
      dropout: 0.1
    core_model:
      _target_: exp.models.components.ttt.TTT
      dim: 1024
      dim_ff_hidden: 4096
      depth: 16
      num_head: 32
      base_lr: [0.0001, 0.1]
      chunk_size: 64
      dropout: 0.1
